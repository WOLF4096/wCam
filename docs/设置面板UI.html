<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>更多设置</title>
    <style>
        :root {
            /* 严格采用您的配色方案 */
            --bg-color: #000000;       /* 页面底色 */
            --surface: #1F1F1F;        /* 卡片底色 */
            --primary: #F5CE40;        /* 选中态背景 */
            --text-active: #000000;    /* 选中态文字 (黑) */
            --unselected-bg: #333333;  /* 未选中背景 (灰) */
            --unselected-text: #FFFFFF;/* 未选中文字 (白) */
            --text-main: #A7A8A8;      /* 标题/常规文字 */
            
            --radius-card: 12px;
            --radius-btn: 6px;
            --transition: 0.2s ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px 14px;
            font-size: 14px;
        }

        /* 顶部导航 */
        .top-bar {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            padding: 4px 0 16px 0;
            cursor: pointer;
        }
        .top-bar:active { opacity: 0.7; }

        /* 卡片容器 (全部无描边) */
        .card {
            background: var(--surface);
            border-radius: var(--radius-card);
            padding: 12px 14px;
            margin-bottom: 12px;
            border: none; 
        }

        .card-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
        .hidden { display: none !important; }

        /* 分段控制器 (无描边，独立色块) */
        .segment-group {
            display: flex; 
            gap: 8px;
            background: transparent; 
            margin-bottom: 10px;
            border: none;
        }
        .segment-item {
            flex: 1; text-align: center; padding: 8px 0; font-size: 13px; font-weight: 500;
            background: var(--unselected-bg); color: var(--unselected-text); 
            border-radius: var(--radius-btn); transition: var(--transition); cursor: pointer;
            border: none;
        }
        .segment-item.active { 
            background: var(--primary); 
            color: var(--text-active); 
        }

        /* 标签筹码 (无描边) */
        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            padding: 8px 4px; border-radius: var(--radius-btn);
            background: var(--unselected-bg); color: var(--unselected-text); 
            font-size: 13px; text-align: center; flex-grow: 1; cursor: pointer;
            border: none; transition: var(--transition);
        }
        .chip:active { transform: scale(0.96); }
        .chip.active { 
            background: var(--primary); 
            color: var(--text-active); 
            font-weight: 500;
        }

        /* 滑块定制 */
        .slider-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
        .slider-label { font-size: 13px; min-width: 50px; }
        input[type="range"] { 
            flex: 1; 
            -webkit-appearance: none;
            height: 4px; 
            background: var(--unselected-bg); 
            outline: none; 
            border-radius: 2px; 
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
        .slider-val { min-width: 40px; text-align: right; font-size: 14px; font-weight: 500; color: var(--primary); }

        /* 输入框 (无描边) */
        .input-group {
            display: flex; align-items: center; gap: 10px; margin-top: 8px; 
            background: var(--unselected-bg); padding: 8px 12px; 
            border-radius: var(--radius-btn);
            border: none;
        }
        .input-group input { 
            flex: 1; border: none; background: transparent; 
            font-size: 14px; color: var(--unselected-text); outline: none; 
            text-align: center;
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.6); }
        
        /* 紧凑网格 */
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

        /* 安卓风格开关 */
        .switch { 
            position: relative; width: 44px; height: 24px; 
            background: var(--unselected-bg); border-radius: 24px; 
            cursor: pointer; transition: var(--transition); 
        }
        .switch::after { 
            content: ''; position: absolute; width: 18px; height: 18px; 
            border-radius: 50%; background: var(--unselected-text); 
            top: 3px; left: 3px; transition: var(--transition); 
        }
        .switch.active { background: var(--primary); }
        .switch.active::after { 
            transform: translateX(20px); 
            background: var(--text-active); 
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="top-bar">
        &lt; 更多设置
    </div>

    <!-- 1. 格式 -->
    <div class="card">
        <div class="card-title">保持格式</div>
        <div class="chip-group" id="format-group">
            <div class="chip active" data-val="jpg" onclick="toggleFormat(this)">JPG</div>
            <div class="chip" data-val="png" onclick="toggleFormat(this)">PNG</div>
            <div class="chip" data-val="raw" onclick="toggleFormat(this)">RAW</div>
        </div>
        <div class="slider-row" id="jpg-quality-box">
            <span class="slider-label">JPG质量</span>
            <input type="range" min="1" max="100" value="90" oninput="updateSlider('jpg-val', this.value, '%')">
            <span class="slider-val" id="jpg-val">90%</span>
        </div>
        <div class="row" style="margin-top: 10px;">
            <span class="slider-label">保存地理位置</span>
            <div class="switch active" onclick="this.classList.toggle('active')"></div>
        </div>
    </div>

    <!-- 2. 算法处理 -->
    <div class="card" id="algo-card">
        <div class="card-title">处理方式</div>
        <div class="segment-group">
            <div class="segment-item active" onclick="switchPanel(this, 'algo-panel', 'algo-none')">无</div>
            <div class="segment-item" onclick="switchPanel(this, 'algo-panel', 'algo-demosaic')">去马赛克</div>
        </div>
        <div id="algo-none" class="grid-4 algo-panel">
            <div class="chip active" onclick="setSingle(this)">RGB通道</div>
            <div class="chip" onclick="setSingle(this)">RGB合并</div>
            <div class="chip" onclick="setSingle(this)">原始拜尔</div>
            <div class="chip" onclick="setSingle(this)">灰度</div>
        </div>
        <div id="algo-demosaic" class="grid-5 hidden algo-panel">
            <div class="chip active" onclick="setSingle(this)">AMaZE</div>
            <div class="chip" onclick="setSingle(this)">RCD</div>
            <div class="chip" onclick="setSingle(this)">DCB</div>
            <div class="chip" onclick="setSingle(this)">LMMSE</div>
            <div class="chip" onclick="setSingle(this)">IGV</div>
            <div class="chip" onclick="setSingle(this)">AHD</div>
            <div class="chip" onclick="setSingle(this)">EAHD</div>
            <div class="chip" onclick="setSingle(this)">HPHD</div>
            <div class="chip" onclick="setSingle(this)">VNG4</div>
            <div class="chip" onclick="setSingle(this)">Fast</div>
        </div>
    </div>

    <!-- 3. 倒计时 -->
    <div class="card">
        <div class="card-title">倒计时</div>
        <div class="slider-row" style="margin-top:0;">
            <input type="range" min="0" max="10" step="1" value="0" oninput="updateSlider('cd-val', this.value, 's')">
            <span class="slider-val" id="cd-val">0s</span>
        </div>
    </div>

    <!-- 4. 自动拍摄 -->
    <div class="card">
        <div class="card-title">自动拍摄</div>
        <div class="segment-group" style="margin-bottom:0;">
            <div class="segment-item active" onclick="switchPanel(this, 'auto-panel', 'auto-none')">无</div>
            <div class="segment-item" onclick="switchPanel(this, 'auto-panel', 'auto-interval')">间隔</div>
            <div class="segment-item" onclick="switchPanel(this, 'auto-panel', 'auto-continuous')">连续</div>
        </div>
        <div id="auto-none" class="auto-panel"></div>
        <div id="auto-interval" class="input-group hidden auto-panel" style="margin-top: 10px;">
            <span style="color: var(--unselected-text);">间隔</span>
            <input type="number" value="5" inputmode="numeric">
            <span style="color: var(--unselected-text);">秒拍一张</span>
        </div>
        <div id="auto-continuous" class="input-group hidden auto-panel" style="margin-top: 10px;">
            <span style="color: var(--unselected-text);">连续拍</span>
            <input type="number" value="10" inputmode="numeric">
            <span style="color: var(--unselected-text);">张</span>
        </div>
    </div>

    <!-- 5. 水印 (已去除边距选项) -->
    <div class="card" id="wm-card">
        <div class="card-title">水印</div>
        <div class="segment-group">
            <div class="segment-item active" onclick="switchPanel(this, 'wm-panel', 'wm-none')">无</div>
            <div class="segment-item" onclick="switchPanel(this, 'wm-panel', 'wm-settings')">内部</div>
            <div class="segment-item" onclick="switchPanel(this, 'wm-panel', 'wm-settings')">外部</div>
        </div>
        <div id="wm-none" class="wm-panel"></div>
        <div id="wm-settings" class="hidden wm-panel">
            <div class="chip-group">
                <div class="chip active" onclick="toggleMulti(this)">时间</div>
                <div class="chip" onclick="toggleMulti(this)">参数</div>
                <div class="chip" data-text="true" onclick="toggleMulti(this, checkWmText)">固定文本</div>
            </div>
            <div class="input-group hidden" id="wm-text-box" style="margin-top: 12px;">
                <input type="text" placeholder="输入水印文本..." style="text-align: left;">
            </div>
        </div>
    </div>

<script>
    // 基础交互：滑块更新
    function updateSlider(id, val, suffix) { 
        document.getElementById(id).innerText = val + suffix; 
    }
    
    // 单选筹码：算法选择
    function setSingle(el) {
        const siblings = el.parentElement.querySelectorAll('.chip');
        siblings.forEach(s => s.classList.remove('active'));
        el.classList.add('active');
    }

    // 多选筹码：切换
    function toggleMulti(el, callback) {
        el.classList.toggle('active');
        if(callback) callback();
    }

    // 面板切换：分段控制器
    function switchPanel(el, panelClass, targetId) {
        const container = el.parentElement;
        container.querySelectorAll('.segment-item').forEach(s => s.classList.remove('active'));
        el.classList.add('active');

        // 隐藏同类的所有内容面板
        document.querySelectorAll('.' + panelClass).forEach(p => p.classList.add('hidden'));
        
        // 显示目标面板
        if(document.getElementById(targetId)) document.getElementById(targetId).classList.remove('hidden');
    }

    // 核心逻辑 1：格式联动处理
    function toggleFormat(el) {
        const formatGroup = document.getElementById('format-group');
        const activeChips = formatGroup.querySelectorAll('.chip.active');
        
        // 保护机制：格式必须至少选中一个
        if (activeChips.length === 1 && el.classList.contains('active')) return;
        el.classList.toggle('active');

        const isJpg = formatGroup.querySelector('[data-val="jpg"]').classList.contains('active');
        const isPng = formatGroup.querySelector('[data-val="png"]').classList.contains('active');
        const isRaw = formatGroup.querySelector('[data-val="raw"]').classList.contains('active');

        // 1. JPG 滑块联动
        const jpgBox = document.getElementById('jpg-quality-box');
        if (isJpg) jpgBox.classList.remove('hidden');
        else jpgBox.classList.add('hidden');

        // 2. 算法与水印逻辑（仅选RAW时不显示）
        const onlyRaw = (isRaw && !isJpg && !isPng);
        const algoCard = document.getElementById('algo-card');
        const wmCard = document.getElementById('wm-card');
        
        if (onlyRaw) {
            algoCard.classList.add('hidden');
            wmCard.classList.add('hidden');
        } else {
            algoCard.classList.remove('hidden');
            wmCard.classList.remove('hidden');
        }
    }

    // 核心逻辑 2：水印文本框联动
    function checkWmText() {
        const isTextOn = document.querySelector('#wm-settings .chip[data-text="true"]').classList.contains('active');
        const textBox = document.getElementById('wm-text-box');
        if (isTextOn) textBox.classList.remove('hidden');
        else textBox.classList.add('hidden');
    }
</script>

</body>
</html>
