<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简扁平化移动端 SVG 图标</title>
<style>
  body {
    background-color: #000000; /* 更纯粹的黑色背景 */
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 20px;
  }
  
  .toolbar {
    display: flex;
    gap: 28px; 
    background: transparent; /* 去除背景框，完全融入界面 */
    padding: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: #ffffff;
    cursor: pointer;
    padding: 12px;
    border-radius: 50%; /* 隐形的圆形点击热区 */
    transition: opacity 0.2s ease;
    opacity: 0.85;
  }

  .icon-btn:hover, .icon-btn:active {
    opacity: 1;
    background: rgba(255, 255, 255, 0.1);
  }

  /* 统一 SVG 基础属性 */
  svg {
    width: 24px; 
    height: 24px;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <!-- 1. 闪光灯：关闭 (纯线条闪电与斜杠) -->
    <button class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
        <line x1="2" y1="2" x2="22" y2="22"></line>
      </svg>
    </button>

    <!-- 2. 闪光灯：开启 (实心闪电，去除描边) -->
    <button class="icon-btn">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
      </svg>
    </button>

    <!-- 3. 闪光灯：常亮 (极简灯管与光线) -->
    <button class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 10h8v10a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V10z"></path>
        <path d="M12 2v4 M7.5 4.5l1.5 2 M16.5 4.5l-1.5 2"></path>
      </svg>
    </button>
    
    <!-- 4. 直方图 (利用加粗的线条直接作为柱状，极致简约) -->
    <button class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- stroke-width="4" 让单根线条直接变成有粗细的柱子 -->
        <path d="M6 20v-8 M12 20V6 M18 20v-11" stroke-width="4"></path>
      </svg>
    </button>

    <!-- 5. 网格线 (纯粹的井字号，去除外边框) -->
    <button class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- 井字线的四个端点延伸至视口边缘附近 -->
        <path d="M8 3v18 M16 3v18 M3 8h18 M3 16h18"></path>
      </svg>
    </button>

    <!-- 6. 设置 (极简横向控制推子) -->
    <button class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- 上排推子 -->
        <path d="M14 8H3 M21 8h-3"></path>
        <circle cx="14" cy="8" r="2" fill="currentColor"></circle>
        <!-- 下排推子 -->
        <path d="M10 16H3 M21 16h-7"></path>
        <circle cx="10" cy="16" r="2" fill="currentColor"></circle>
      </svg>
    </button>
  </div>

</body>
</html>
